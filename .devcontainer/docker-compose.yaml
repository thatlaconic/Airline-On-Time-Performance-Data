version: '3'
services:
  dbt-bq:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    image: dbt/bigquery
    volumes:
      - ..:/workspaces:cached
    environment:
      - DBT_PROFILES_DIR=/workspaces/.dbt
      - GOOGLE_APPLICATION_CREDENTIALS=/workspaces/.gcp/credentials.json
    # Remove network_mode for Codespaces compatibility
    ports:
      - "8080:8080"  # Example port mapping